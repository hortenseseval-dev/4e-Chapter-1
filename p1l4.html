<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>4eB · Part 1 Lesson 4 · What the teacher says</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Lexend:wght@400;500;700&display=swap">
<style>
/* Student site: phone first, one column. Home = lessons by part with progress. Lesson = learn + 5 practice blocks. */
:root{
  --bg:#121829; --panel:#1b2340; --panel2:#243057; --line:#34406b;
  --fg:#f2ecdf; --muted:#a9b0c9; --accent:#ffc94a;
  --c1:#46d3c3; --c2:#ff7d5c; --c3:#ffc94a; --c4:#b79cff; --ok:#5fd18a; --bad:#ff6b6b; --rec:#ff4d6d;
  --p1:#46d3c3; --p2:#ff7d5c; --p3:#b79cff;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Lexend","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}
.tag{font-size:.75em;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(2rem,7vw,3rem)}
h2{font-size:clamp(1.35rem,5vw,1.85rem);display:flex;align-items:baseline;gap:10px}
h2 .n{color:var(--accent)}
h3{font-size:1.2em}
.lead{color:var(--muted);margin:0}
header{display:flex;flex-direction:column;gap:6px}
.back{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.3em .9em;font-size:.85em;text-decoration:none}
nav.jump{display:flex;flex-wrap:wrap;gap:8px}
nav.jump a{text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.3em .9em;font-size:.85em}
section{display:flex;flex-direction:column;gap:14px;scroll-margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.c1{color:var(--c1);font-weight:700} .c2{color:var(--c2);font-weight:700} .c3{color:var(--c3);font-weight:700} .c4{color:var(--c4);font-weight:700}
.strike{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.boxes .card{border-width:3px}
.b1{border-color:var(--c1)!important} .b2{border-color:var(--c2)!important} .b3{border-color:var(--c3)!important} .b4{border-color:var(--c4)!important}
.big{font-family:var(--display);font-weight:800;font-size:1.45em;line-height:1.2}
.warn{background:var(--panel2);border-radius:12px;padding:12px 14px}
.say{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.say:hover{border-color:var(--accent)}
.say .e{font-size:1.5em;margin-right:6px}
.spk{flex:none;width:2.1em;height:2.1em;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-size:.85em}
.btn{border:0;border-radius:12px;padding:.55em 1em;background:var(--accent);color:var(--bg);font-weight:700}
.btn.ghost{background:var(--panel2);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.q{display:flex;flex-direction:column;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .s{font-size:1.1em}
.choice{border:2px solid var(--line);background:var(--panel2);border-radius:10px;padding:.35em .9em;font-weight:700;text-align:left}
.choice.right{border-color:var(--ok);background:var(--ok);color:#0c2416}
.choice.wrong{border-color:var(--bad);background:transparent;color:var(--bad)}
.fb{font-size:.9em;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.score{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:12px;padding:10px 14px;font-weight:700}
.score b{font-family:var(--display);font-size:1.4em;color:var(--accent);font-variant-numeric:tabular-nums}
input[type=text]{width:100%;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
input.good{border-color:var(--ok)} input.badin{border-color:var(--bad)}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{border:2px solid var(--line);background:var(--panel2);border-radius:10px;padding:.5em .7em;font-weight:700;min-height:3.2rem;overflow-wrap:anywhere}
.mt.emoji{font-size:1.6em;padding:0 .2em;line-height:1}
.mt.sel{border-color:var(--accent)}
.mt.done{border-color:var(--ok);background:var(--ok);color:#0c2416;opacity:.75}
.mt.err{border-color:var(--bad);animation:shake .3s}
/* speaking */
.sp{display:flex;flex-direction:column;gap:10px;padding-block:14px;border-bottom:1px solid var(--line)}
.sp:last-child{border-bottom:0}
.sp .model{font-size:1.2em;font-weight:700}
.rec{background:var(--rec);color:#fff}
.rec.on{animation:blink 1s infinite}
.heard{font-size:.9em;color:var(--muted)}
.heard b{color:var(--fg)}
.stars{display:flex;gap:6px;flex-wrap:wrap}
.stars button{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:.25em .8em;font-size:.85em}
.stars button.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.note{background:var(--panel2);border-radius:12px;padding:10px 14px;font-size:.9em;color:var(--muted)}
/* home */
.part{border-top:6px solid var(--pc)}
.part h3 span{color:var(--pc)}
.lk{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--panel2);border:1px solid transparent;border-radius:12px;padding:10px 12px}
.lk:hover{border-color:var(--pc)}
.lk .num{flex:none;width:2em;height:2em;border-radius:50%;background:var(--pc);color:var(--bg);display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.lk .t{flex:1;min-width:0}
.lk small{display:block;color:var(--muted);font-size:.8em}
.bar{flex:none;width:64px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
@keyframes blink{50%{opacity:.55}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

// ---------- lesson ----------
let lesson=null,P=null,S=null;
function open(id){lesson=BY[id];P=practiceOf(lesson);store[id]=store[id]||{};S=store[id];['choose','write','listen','stars'].forEach(k=>S[k]=S[k]||{});
 document.title=`4eB · ${lesson.title}`;const test=!lesson.practice;const lr=lesson.learn||{};
 const blocks=[['learn','Lesson'],P.choose&&['choose','Choose'],P.write&&['write','Write'],P.listen&&['listen','Listen'],P.speak&&['speak','Speak']].filter(Boolean);
 app.innerHTML=`<header><a class="back" href="${HOME}">← All lessons</a><span class="tag">Part ${lesson.part} · Lesson ${lesson.n}${test?' · Revision':''}</span><h1>${esc(lesson.title)}</h1><p class="lead">🎯 ${esc(lesson.goal)}<br>Learn the lesson, practise, then speak and listen to yourself.</p>
 <nav class="jump">${blocks.map((b,i)=>`<a href="#${lesson.id}" data-jump="${b[0]}">${i+1} · ${b[1]}</a>`).join('')}</nav></header>
 ${blocks.map((b,i)=>`<section id="sec-${b[0]}"><h2><span class="n">${i+1}</span> ${secTitle(b[0],test)}</h2>${secLead(b[0])}<div class="card" id="ex-${b[0]}"></div>${['choose','write','listen'].includes(b[0])?`<div class="score">Score <b id="sc-${b[0]}"></b></div>`:''}</section>`).join('')}
 ${P.free&&P.free.length?`<section><h2>Your turn! Free speaking</h2><div class="card" id="ex-free"></div></section>`:''}
 <div class="row"><button class="btn ghost" id="resetL">Start again from zero</button><span id="resetC"></span></div>
 ${nextLink()}`;
 renderLearn(lr);P.choose&&renderChoose();P.write&&renderWrite();P.listen&&renderListen();P.speak&&renderSpeak();window.scrollTo(0,0)}
function nextLink(){const i=L.indexOf(lesson);return i<L.length-1?`<a class="lk" style="--pc:var(--p${L[i+1].part})" href="${href(L[i+1].id)}"><span class="num">→</span><span class="t"><small>Next lesson</small><b>${esc(L[i+1].title)}</b></span></a>`:''}
const secTitle=(k,test)=>({learn:test?'Revise':'The lesson',match:'Match',choose:'Choose the right answer',write:'Write it',listen:'Listen: what do you hear?',speak:'Speak and compare'})[k];
const secLead=k=>({match:'<p class="lead">Tap one box on the left, then its partner on the right.</p>',listen:'<p class="lead">Press 🔊, listen, then choose the sentence you hear.</p>',speak:'<p class="lead">1. Listen to the model. 2. Record your voice. 3. Listen to yourself. 4. Compare with the model.</p><div class="note" id="micNote" hidden></div>'})[k]||'';
function renderLearn(lr){let h='';
 if(lr.boxes)h+=`<div class="boxes">${lr.boxes.map(b=>`<div class="card b${b.c}"><span class="tag">${esc(b.tag)}</span><div class="big">${mk(b.text)}</div></div>`).join('')}</div>`;
 if(lr.warn)h+=`<div class="warn">${mk(lr.warn)}</div>`;
 if(lr.examples)h+=`<span class="tag">Listen and repeat</span>`+lr.examples.map(x=>spk(x)).join('');
 if(lr.vocab)h+=`<span class="tag">Words and sentences · tap to listen</span>`+lr.vocab.map(([t,e])=>spk(t,`<span><span class="e">${e}</span>${mk(t)}</span>`)).join('');
 document.getElementById('ex-learn').innerHTML=h}
// match
function renderMatch(){const pairs=P.match;S.mm=S.mm||{};const left=pairs.map((p,i)=>[p[0],i]),right=shuffle(pairs.map((p,i)=>[p[1],i]),lesson.id.length+pairs.length);
 const done=i=>S.match||S.mm[i];
 document.getElementById('ex-match').innerHTML=`<div class="match"><div class="col">${left.map(([t,i])=>`<button class="mt${isEmoji(t)?' emoji':''}${done(i)?' done':''}" data-ml="${i}" ${done(i)?'disabled':''}>${mk(t)}</button>`).join('')}</div>
 <div class="col">${right.map(([t,i])=>`<button class="mt${isEmoji(t)?' emoji':''}${done(i)?' done':''}" data-mr="${i}" ${done(i)?'disabled':''}>${mk(t)}</button>`).join('')}</div></div>
 <div class="fb ${S.match?'ok':''}">${S.match?'All matched. Well done! 🎉':''}</div>`}
let selL=null;
function clickMatch(b){if(b.dataset.ml!==undefined){document.querySelectorAll('[data-ml]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selL=+b.dataset.ml;const t=P.match[selL];const en=[t[0],t[1]].find(x=>!isEmoji(x)&&!isFr(x));if(en)say(en);return}
 if(selL==null)return;const r=+b.dataset.mr;if(r===selL){S.mm[r]=1;if(Object.keys(S.mm).length===P.match.length)S.match=true;save();selL=null;renderMatch()}else{b.classList.add('err');setTimeout(()=>b.classList.remove('err'),400)}}
// choose
function renderChoose(){const C=P.choose;document.getElementById('ex-choose').innerHTML=C.map(([s,opts,a],i)=>{const d=S.choose[i];return `<div class="q"><div class="s">${mk(s).replace(/____/g,'<b>____</b>')}</div><div class="row">${opts.map(o=>`<button class="choice ${d&&o===a?'right':''} ${d&&d.pick===o&&o!==a?'wrong':''}" data-ch="${i}" data-o="${esc(o)}" ${d?'disabled':''}>${esc(o)}</button>`).join('')}</div><div class="fb ${d?(d.ok?'ok':'no'):''}">${d?(d.ok?'Well done!':'Not quite. The answer is: '+esc(a)):''}</div></div>`}).join('');
 document.getElementById('sc-choose').textContent=`${Object.values(S.choose).filter(x=>x.ok).length} / ${C.length}`}
const filled=(s,a)=>s.includes('____')?s.replace('____',a):a;
// write
function renderWrite(){const W=P.write;document.getElementById('ex-write').innerHTML=W.map(([q,ans],i)=>{const d=S.write[i]||{};return `<div class="q"><div class="s">${mk(q)}</div><div class="row" style="flex-wrap:nowrap"><input type="text" id="w${i}" value="${esc(d.v||'')}" class="${d.ok===true?'good':d.ok===false?'badin':''}" autocomplete="off" autocapitalize="sentences" spellcheck="false"><button class="btn" data-wr="${i}">Check</button></div><div class="fb ${d.ok===true?'ok':d.ok===false?'no':''}">${d.ok===true?'Perfect!':d.ok===false?hint(d.v||'',ans):''}</div></div>`}).join('');
 document.getElementById('sc-write').textContent=`${Object.values(S.write).filter(x=>x.ok).length} / ${W.length}`}
function hint(v,ans){const n=norm(v),a=norm(ans[0]);
 if(ans.some(x=>loose(x)===loose(v)))return "Almost! Check the apostrophe ' (don't, I'm…).";
 if(/doesn't \w+s\b/.test(n)&&!/doesn't \w+s\b/.test(a))return "Careful: no -s after doesn't!";
 if(/\bmust to\b/.test(n))return "Careful: must + verb, no 'to'!";
 if(/don't/.test(n)&&/doesn't/.test(a))return "Look at the subject: he, she, it → doesn't.";
 if(/doesn't/.test(n)&&/don't/.test(a))return "Look at the subject: I, you, we, they → don't.";
 if(/\bhave\b/.test(n)&&/\bhas\b/.test(a))return "Look at the subject: he, she, it → has.";
 if(/\bhas\b/.test(n)&&/\bhave\b/.test(a))return "Look at the subject: I, you, we, they → have.";
 return `Try again! <button class="btn ghost" data-show="${esc(ans[0])}" style="padding:.2em .7em;font-size:.85em">Show the answer</button>`}
function checkW(i){const v=document.getElementById('w'+i).value;const ok=P.write[i][1].some(x=>norm(x)===norm(v));S.write[i]={v,ok};save();renderWrite();if(ok)say(P.write[i][1][0])}
// listen
function renderListen(){const X=P.listen;document.getElementById('ex-listen').innerHTML=X.map(([a,b],i)=>{const d=S.listen[i];const opts=(i%2===0)?[a,b]:[b,a];return `<div class="q"><div class="row"><button class="btn" data-say="${esc(a)}">🔊 Sentence ${i+1}</button><button class="btn ghost" data-slow="${esc(a)}">🐢 Slow</button></div><div class="row">${opts.map(o=>`<button class="choice ${d&&o===a?'right':''} ${d&&d.pick===o&&o!==a?'wrong':''}" data-li="${i}" data-o="${esc(o)}" ${d?'disabled':''}>${esc(o)}</button>`).join('')}</div><div class="fb ${d?(d.ok?'ok':'no'):''}">${d?(d.ok?'Good ears!':'Listen again: '+esc(a)):''}</div></div>`}).join('');
 document.getElementById('sc-listen').textContent=`${Object.values(S.listen).filter(x=>x.ok).length} / ${X.length}`}
// speak
const canRec=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const recs={};
function speakRow(id,text,model){const st=S.stars[id];return `<div class="sp" data-id="${id}"><div class="model">${mk(text)}</div>
 <div class="row">${model?`<button class="btn ghost" data-say="${esc(text)}">🔊 Model</button>`:''}<button class="btn rec" data-rec="${id}" ${canRec?'':'disabled'}>🎙️ Record</button><button class="btn ghost" data-play="${id}" ${recs[id]?'':'disabled'}>▶ My voice</button>${model?`<button class="btn ghost" data-cmp="${id}" ${recs[id]?'':'disabled'}>⇄ Compare</button>`:''}</div>
 <div class="heard" id="h-${id}"></div>
 <div class="stars"><span class="tag" style="align-self:center">How was it?</span>${['😕 Try again','🙂 Almost','🤩 Great!'].map((l,k)=>`<button class="${st===k?'on':''}" data-star="${id}" data-k="${k}">${l}</button>`).join('')}</div></div>`}
function renderSpeak(){document.getElementById('ex-speak').innerHTML=P.speak.map((t,i)=>speakRow('m'+i,t,true)).join('');
 const f=document.getElementById('ex-free');if(f)f.innerHTML=P.free.map((t,i)=>speakRow('f'+i,t,false)).join('');
 if(!canRec){const n=document.getElementById('micNote');n.hidden=false;n.textContent="Recording does not work here. Open this page in Chrome, Edge or Safari, from a https:// address. You can still listen to the models."}}
let stream=null,recorder=null,recog=null,stopT=null;
async function startRec(id){if(recorder&&recorder.state==='recording'){stopRec();return}
 try{stream=stream||await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){const n=document.getElementById('micNote');n.hidden=false;n.textContent="The microphone is blocked. Click the lock 🔒 next to the address, allow the microphone, then try again.";return}
 const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m=>MediaRecorder.isTypeSupported?.(m))||'';const chunks=[];
 recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(recs[id])URL.revokeObjectURL(recs[id]);recs[id]=URL.createObjectURL(blob);
  const row=document.querySelector(`.sp[data-id="${id}"]`);if(!row)return;row.querySelector('[data-play]').disabled=false;const c=row.querySelector('[data-cmp]');if(c)c.disabled=false;const b=row.querySelector('[data-rec]');b.classList.remove('on');b.textContent='🎙️ Record again'};
 recorder.start();const b=document.querySelector(`[data-rec="${id}"]`);b.classList.add('on');b.textContent='⏹ Stop';clearTimeout(stopT);stopT=setTimeout(stopRec,15000);
 const h=document.getElementById('h-'+id);h.textContent='';
 if(SR){try{recog=new SR();recog.lang='en-GB';recog.interimResults=false;
  recog.onresult=e=>{const t=e.results[0][0].transcript;const model=id[0]==='m'?P.speak[+id.slice(1)]:null;const ok=model&&loose(t)===loose(noEmoji(model));h.innerHTML=`The computer heard: <b>${esc(t)}</b>${model?(ok?' ✅':' — compare with the model'):''}`};
  recog.onerror=()=>{};recog.start()}catch(e){}}}
function stopRec(){clearTimeout(stopT);if(recorder&&recorder.state==='recording')recorder.stop();try{recog&&recog.stop()}catch(e){}}
const play=url=>new Promise(r=>{const a=new Audio(url);a.onended=r;a.onerror=r;a.play().catch(r)});

// ---------- events ----------
document.addEventListener('click',async e=>{const t=e.target.closest('button,a');if(!t)return;const d=t.dataset;
 if(d.jump){e.preventDefault();document.getElementById('sec-'+d.jump)?.scrollIntoView({behavior:'smooth'});return}
 if(d.say){say(d.say);return}
 if(d.slow){say(d.slow,.6);return}
 if(d.ml!==undefined||d.mr!==undefined){clickMatch(t);return}
 if(d.ch!==undefined){const i=+d.ch,[s,o,a]=P.choose[i];S.choose[i]={pick:d.o,ok:d.o===a};save();renderChoose();if(!isFr(s))say(filled(plain(s),a));return}
 if(d.wr!==undefined){checkW(+d.wr);return}
 if(d.show){t.parentElement.innerHTML=mk(d.show);say(d.show);return}
 if(d.li!==undefined){const i=+d.li;S.listen[i]={pick:d.o,ok:d.o===P.listen[i][0]};save();renderListen();return}
 if(d.rec){startRec(d.rec);return}
 if(d.play){play(recs[d.play]);return}
 if(d.cmp){const id=d.cmp;t.disabled=true;await sayP(P.speak[+id.slice(1)]);await new Promise(r=>setTimeout(r,400));await play(recs[id]);t.disabled=false;return}
 if(d.star){S.stars[d.star]=+d.k;save();t.parentElement.querySelectorAll('[data-star]').forEach(b=>b.classList.toggle('on',b===t));return}
 if(t.id==='resetL'){document.getElementById('resetC').innerHTML='Are you sure? <button class="btn" style="background:var(--bad)" id="yesR">Yes</button> <button class="btn ghost" id="noR">No</button>';return}
 if(t.id==='yesR'){store[lesson.id]={};save();open(lesson.id);return}
 if(t.id==='noR'){document.getElementById('resetC').innerHTML='';return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id?.startsWith('w'))checkW(+e.target.id.slice(1))});
function route(){const h=location.hash.slice(1);if(h&&BY[h])open(h);else home()}
if(PAGE===null){window.addEventListener('hashchange',route);route()}
else if(PAGE===''){const h=location.hash.slice(1);if(h&&BY[h])location.replace(h+'.html');else home()}
else open(PAGE);
})();
</script>
</body>
</html>
